[package]
name = "ck-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "ck_desktop_lib"
# Windows test executables lack the app manifest tauri-build embeds only into bins,
# so they fail to start. Re-enable with a test manifest once the crate has tests.
test = false
doctest = false

[[bin]]
name = "ck-desktop"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
ck-core = { workspace = true }
serde = { workspace = true }
tauri = { workspace = true }

[lints]
workspace = true
