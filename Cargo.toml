[workspace]
resolver = "3"
members = [
  "crates/ck-sys",
  "crates/ck-core",
  "crates/ck-cli",
  "crates/ck-net",
  "crates/ck-release",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
base64 = "0.23.1"
ck-core = { path = "crates/ck-core" }
ck-release = { path = "crates/ck-release" }
ck-sys = { path = "crates/ck-sys" }
clap = { version = "4.6", features = ["derive"] }
dirs = "7.0.0"
ed25519-dalek = { version = "3.0.0", default-features = false }
flate2 = "1.1.11"
getrandom = "0.4.3"
libc = "0.2.191"
# TLS for ck-net only. `ring` is the provider; it is set on ck-net's agent,
# never installed process-wide.
rustls = { version = "0.23.46", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
serde ={ version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
# No `xattr`: extraction never restores extended attributes.
tar = { version = "0.4.46", default-features = false }
tauri = "2.12.6"
tauri-build = "2.7.5"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.54.1", features = [
  "rt",
  "net",
  "io-util",
  "time",
  "process",
  "signal",
  "sync",
  "macros",
] }
# No gzip, cookies, JSON or default TLS: ck-net passes its own rustls provider.
ureq = { version = "3.5.2", default-features = false, features = [
  "rustls-no-provider",
  "platform-verifier",
] }
url = "2.5.8"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Console",
] }
# Stored and Deflate only: every other method needs C or is refused anyway.
zip = { version = "9.7.0", default-features = false, features = ["deflate-flate2"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
