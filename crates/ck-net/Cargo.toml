[package]
name = "ck-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The only crate that links TLS. `ring` compiles C, so this crate is left out
# of the cross-target clippy runs, and nothing links it until M3.
[dependencies]
ck-core.workspace = true
rustls.workspace = true
ureq.workspace = true
url.workspace = true

# T16 and T17: a loopback server, the shared signing helper
# (`ck-core/tests/support/signing.rs`) and archives to serve.
[dev-dependencies]
base64.workspace = true
ed25519-dalek.workspace = true
flate2.workspace = true
getrandom.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true

[lints]
workspace = true
