[package]
name = "ck-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# `cargo run -p ck-cli` runs `ck`, not the test service below.
default-run = "ck"

# The CLI links TLS only for the install commands. Cross-target clippy uses
# `--no-default-features`, so `ring` is not built for a foreign target.
[features]
default = ["net"]
net = ["dep:ck-net"]

[[bin]]
name = "ck"
path = "src/main.rs"

# Dummy service for the integration tests. A [[bin]] so that cargo builds it
# for the tests and sets CARGO_BIN_EXE_ck-test-service. It exits 2 in a release
# build and is never shipped: packaging bundles `ck` only.
[[bin]]
name = "ck-test-service"
path = "tests/support/test_service.rs"

[dependencies]
ck-core.workspace = true
ck-net = { workspace = true, optional = true }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
ck-sys.workspace = true

[lints]
workspace = true
