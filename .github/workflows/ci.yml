name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push or run on the same branch replaces the older one.
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  gate:
    name: Gate (${{ matrix.os }})
    strategy:
      # Each OS reports on its own, so one platform's failure does not hide another's.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup is preinstalled on the runners; with no arguments it installs the
      # toolchain and components pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

      # A release `ck` must ignore the test-profile variables (D21).
      - name: Release-build test
        run: cargo test -p ck-cli --release --locked --test release_build

      # A release build trusts only its built-in catalog keys and never
      # requests plain HTTP (D6).
      - name: Release catalog-trust test
        run: cargo test -p ck-core --release --locked --test release_trust

      - name: UI checks
        run: pnpm check

      - name: UI build has no mock data
        if: runner.os == 'Linux'
        run: |
          pnpm -C apps/desktop build
          if grep -r 0.0.0-mock apps/desktop/ui/dist; then
            echo "mock data leaked into the production build" >&2
            exit 1
          fi

      - name: Install Playwright Chromium
        if: runner.os == 'Linux'
        run: pnpm -C apps/desktop exec playwright install --with-deps chromium

      - name: Playwright journeys
        if: runner.os == 'Linux'
        run: pnpm e2e
