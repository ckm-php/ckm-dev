# Builds PHP for Linux and macOS from pinned sources (D7, D14). It publishes
# nothing: the archives, their descriptors and an unsigned catalog payload are
# run artifacts only. Signing and release publishing come later and never
# restore a cache.
name: PHP build

on:
  push:
    branches: [main]
    paths:
      - build/**
      - catalog/**
      - crates/ck-release/**
      - crates/ck-net/tests/php_archive.rs
      - .github/workflows/php-build.yml
  pull_request:
    paths:
      - build/**
      - catalog/**
      - crates/ck-release/**
      - crates/ck-net/tests/php_archive.rs
      - .github/workflows/php-build.yml
  workflow_dispatch:
    inputs:
      lines:
        description: PHP lines, separated by spaces (7.4, 8.5)
        type: string
        default: '8.5'
      oses:
        description: Operating systems, separated by spaces (linux, macos)
        type: string
        default: linux

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push or run on the same branch replaces the older one.
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan the matrix
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      tool: ${{ steps.matrix.outputs.tool }}
      deps: ${{ steps.matrix.outputs.deps }}
      php: ${{ steps.matrix.outputs.php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute the matrix
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          INPUT_LINES: ${{ inputs.lines }}
          INPUT_OSES: ${{ inputs.oses }}
          # What a push to main or a pull request builds.
          PR_LINES: '7.4 8.5'
          PR_OSES: linux macos
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            lines=$INPUT_LINES
            oses=$INPUT_OSES
          else
            lines=$PR_LINES
            oses=$PR_OSES
          fi
          # Inputs are untrusted text: no globbing, and only known values pass.
          set -f
          for token in $lines; do
            case "$token" in
              7.4 | 8.5) ;;
              *) echo "::error::unknown PHP line in 'lines' (allowed: 7.4, 8.5)"; exit 1 ;;
            esac
          done
          for token in $oses; do
            case "$token" in
              linux | macos) ;;
              *) echo "::error::unknown OS in 'oses' (allowed: linux, macos)"; exit 1 ;;
            esac
          done
          # Canonical order, no duplicates.
          sel_lines=
          for known in 7.4 8.5; do
            for token in $lines; do
              if [ "$token" = "$known" ]; then sel_lines="$sel_lines $known"; break; fi
            done
          done
          sel_oses=
          for known in linux macos; do
            for token in $oses; do
              if [ "$token" = "$known" ]; then sel_oses="$sel_oses $known"; break; fi
            done
          done
          sel_lines=${sel_lines# }
          sel_oses=${sel_oses# }
          if [ -z "$sel_lines" ] || [ -z "$sel_oses" ]; then
            echo "::error::choose at least one PHP line and one OS"
            exit 1
          fi
          echo "lines: $sel_lines; oses: $sel_oses"

          # Each line's stack comes from the manifest. ck-release is always
          # built for Linux, since the payload job runs there.
          matrix=$(jq -c --arg lines "$sel_lines" --arg oses "$sel_oses" '
            {"linux": "ubuntu-22.04", "macos": "macos-15"} as $runners
            | ($lines | split(" ")) as $want_lines
            | ($oses | split(" ")) as $want_oses
            | [.lines[] | select(.line as $l | $want_lines | index($l)) | {line, stack}] as $sel
            | if ($sel | length) != ($want_lines | length)
              then error("a requested line is not in catalog/php-lines.json") else . end
            | {
                tool: {include: [($want_oses + ["linux"] | unique)[] | {os: ., runner: $runners[.]}]},
                deps: {include: [$want_oses[] as $os | ($sel | map(.stack) | unique)[]
                  | {os: $os, runner: $runners[$os], stack: .}]},
                php: {include: [$want_oses[] as $os | $sel[]
                  | {os: $os, runner: $runners[$os], line, stack}]}
              }' catalog/php-lines.json)
          echo "$matrix" | jq .
          {
            echo "tool=$(echo "$matrix" | jq -c .tool)"
            echo "deps=$(echo "$matrix" | jq -c .deps)"
            echo "php=$(echo "$matrix" | jq -c .php)"
          } >>"$GITHUB_OUTPUT"

  lint:
    name: Lint the build scripts
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version

      # `source=` directives are relative to each script, so each one is
      # checked from its own folder.
      - name: shellcheck and bash -n
        run: |
          mapfile -d '' files < <(find build/php -type f -name '*.sh' -print0 | sort -z)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no build scripts found"
            exit 1
          fi
          status=0
          for file in "${files[@]}"; do
            echo "checking $file"
            bash -n "$file" || status=1
            (cd "$(dirname "$file")" && shellcheck -x -P SCRIPTDIR "$(basename "$file")") || status=1
          done
          exit "$status"

      # T5: the pinned fetch with a stub curl and ck-release; no network.
      - name: Fetch self-test
        run: bash build/php/tests/fetch-selftest.sh

  tool:
    name: ck-release (${{ matrix.os }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.tool) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup is preinstalled; with no arguments it installs the toolchain
      # pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build ck-release
        run: cargo build -p ck-release --release --locked

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ck-release-${{ matrix.os }}
          path: target/release/ck-release
          if-no-files-found: error
          retention-days: 1

  deps:
    name: Libraries (${{ matrix.os }}, ${{ matrix.stack }})
    needs: [plan, lint, tool]
    # Each leg stands alone: one OS failing in `tool` must not skip the other
    # OS's legs. A leg without its ck-release fails at the download.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.lint.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.deps) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      MATRIX_OS: ${{ matrix.os }}
      MATRIX_STACK: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ck-release-${{ matrix.os }}
          path: ${{ runner.temp }}/ck-release

      # Artifacts drop the executable bit. ck-release finds the lock through
      # a path baked in at build time, so `lock check` also proves this
      # checkout sits where the tool job's did.
      - name: Set up ck-release
        run: |
          chmod 755 "$RUNNER_TEMP/ck-release/ck-release"
          echo "CK_RELEASE_BIN=$RUNNER_TEMP/ck-release/ck-release" >>"$GITHUB_ENV"
          "$RUNNER_TEMP/ck-release/ck-release" lock check

      # The fixed build root. Only this runner step uses sudo; the build
      # scripts never do.
      - name: Create the build root
        run: |
          sudo mkdir -p /opt/ck-dev-build
          sudo chown "$(id -u):$(id -g)" /opt/ck-dev-build

      # Test runs only: a publishable build never restores a cache. An exact
      # key, with no restore-keys, so a stale stack is never reused.
      - name: Restore the library stack
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/ck-dev-build/deps/${{ matrix.stack }}
          key: php-deps-${{ matrix.runner }}-${{ runner.arch }}-${{ matrix.stack }}-${{ hashFiles('catalog/sources.lock.json', 'catalog/php-lines.json', 'build/php/build.sh', 'build/php/deps/**', 'build/php/lib/**') }}

      - name: Build the library stack
        if: steps.cache.outputs.cache-hit != 'true'
        run: /bin/bash build/php/build.sh deps "$MATRIX_STACK"

      # Artifacts lose modes and links, so the prefix travels as a tarball.
      - name: Pack the library stack
        run: tar -C /opt/ck-dev-build/deps -czf "$RUNNER_TEMP/deps-$MATRIX_OS-$MATRIX_STACK.tar.gz" "$MATRIX_STACK"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deps-${{ matrix.os }}-${{ matrix.stack }}
          path: ${{ runner.temp }}/deps-${{ matrix.os }}-${{ matrix.stack }}.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  php:
    name: PHP ${{ matrix.line }} (${{ matrix.os }})
    needs: [plan, lint, tool, deps]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.lint.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.php) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      MATRIX_OS: ${{ matrix.os }}
      MATRIX_LINE: ${{ matrix.line }}
      MATRIX_STACK: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ck-release-${{ matrix.os }}
          path: ${{ runner.temp }}/ck-release

      - name: Set up ck-release
        run: |
          chmod 755 "$RUNNER_TEMP/ck-release/ck-release"
          echo "CK_RELEASE_BIN=$RUNNER_TEMP/ck-release/ck-release" >>"$GITHUB_ENV"
          "$RUNNER_TEMP/ck-release/ck-release" lock check

      - name: Create the build root
        run: |
          sudo mkdir -p /opt/ck-dev-build
          sudo chown "$(id -u):$(id -g)" /opt/ck-dev-build

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deps-${{ matrix.os }}-${{ matrix.stack }}
          path: ${{ runner.temp }}/deps

      - name: Unpack the library stack
        run: |
          mkdir -p /opt/ck-dev-build/deps
          tar -C /opt/ck-dev-build/deps -xzf "$RUNNER_TEMP/deps/deps-$MATRIX_OS-$MATRIX_STACK.tar.gz"

      - name: Build PHP
        run: /bin/bash build/php/build.sh php "$MATRIX_LINE"

      # T6 on the relocated tree that was packed.
      - name: Audit
        run: /bin/bash build/php/build.sh audit "/opt/ck-dev-build/php/$MATRIX_LINE/root"

      - name: Find the archive and descriptor
        run: |
          shopt -s nullglob
          archives=(/opt/ck-dev-build/out/*.tar.gz)
          descriptors=(/opt/ck-dev-build/out/*.json)
          if [ "${#archives[@]}" -ne 1 ] || [ "${#descriptors[@]}" -ne 1 ]; then
            ls -la /opt/ck-dev-build/out
            echo "::error::expected one archive and one descriptor in /opt/ck-dev-build/out"
            exit 1
          fi
          echo "OUT_ARCHIVE=${archives[0]}" >>"$GITHUB_ENV"
          echo "OUT_DESCRIPTOR=${descriptors[0]}" >>"$GITHUB_ENV"
          cat "${descriptors[0]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-${{ matrix.os }}-${{ matrix.line }}
          path: |
            ${{ env.OUT_ARCHIVE }}
            ${{ env.OUT_DESCRIPTOR }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      # The payload job reads a folder of descriptors only.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: descriptor-${{ matrix.os }}-${{ matrix.line }}
          path: ${{ env.OUT_DESCRIPTOR }}
          if-no-files-found: error
          retention-days: 7

  contract:
    name: Contract PHP ${{ matrix.line }} (${{ matrix.os }})
    needs: [plan, lint, tool, php]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.lint.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.php) }}
    # A fresh runner: no build root and no library stack, so the archive
    # must run from wherever it is installed. Steps stay within bash 3.2:
    # once Homebrew is hidden on macOS, `bash` is /bin/bash.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      # On macOS the cache is not saved: its post step runs after Homebrew
      # is hidden.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ runner.os != 'macOS' }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ck-release-${{ matrix.os }}
          path: ${{ runner.temp }}/ck-release

      - name: Set up ck-release
        run: |
          chmod 755 "$RUNNER_TEMP/ck-release/ck-release"
          echo "CK_RELEASE_BIN=$RUNNER_TEMP/ck-release/ck-release" >>"$GITHUB_ENV"
          "$RUNNER_TEMP/ck-release/ck-release" lock check

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: php-${{ matrix.os }}-${{ matrix.line }}
          path: ${{ runner.temp }}/php

      # T4 runs from the crate folder, so every path it gets is absolute.
      - name: Find the archive and descriptor
        run: |
          shopt -s nullglob
          archives=("$RUNNER_TEMP"/php/*.tar.gz)
          descriptors=("$RUNNER_TEMP"/php/*.json)
          if [ "${#archives[@]}" -ne 1 ] || [ "${#descriptors[@]}" -ne 1 ]; then
            ls -la "$RUNNER_TEMP/php"
            echo "::error::expected one archive and one descriptor in the php artifact"
            exit 1
          fi
          {
            echo "CK_PHP_ARCHIVE=${archives[0]}"
            echo "CK_PHP_DESCRIPTOR=${descriptors[0]}"
            echo "CK_PHP_SMOKE=$GITHUB_WORKSPACE/build/php/smoke/smoke.php"
          } >>"$GITHUB_ENV"

      # Compiled before Homebrew is hidden on macOS, so only the run happens
      # without it: the test binary is run directly, with no cargo.
      - name: Build the contract test
        run: |
          bin=$(cargo test -p ck-net --locked --test php_archive --no-run --message-format=json |
            jq -r 'select(.reason == "compiler-artifact" and .target.name == "php_archive" and .profile.test == true) | .executable')
          if [ -z "$bin" ] || [ ! -x "$bin" ]; then
            echo "::error::no php_archive test binary was built"
            exit 1
          fi
          echo "CK_PHP_TEST_BIN=$bin" >>"$GITHUB_ENV"

      # T7 on macOS: PHP must not load anything from Homebrew. /usr/local
      # itself sits in /usr, which is expected to be read-only on the sealed
      # system volume, so only its library folders move (the dyld fallback
      # path includes /usr/local/lib). The runner is thrown away after the
      # job, so nothing is restored.
      - name: Hide Homebrew
        if: runner.os == 'macOS'
        run: |
          if [ -e /opt/homebrew ]; then
            sudo mv /opt/homebrew /opt/homebrew.hidden
          fi
          for dir in /usr/local/lib /usr/local/include /usr/local/opt /usr/local/Cellar /usr/local/Frameworks; do
            if [ -e "$dir" ]; then
              sudo mv "$dir" "$dir.hidden"
            fi
          done
          test ! -e /opt/homebrew
          test ! -e /usr/local/lib

      - name: No build root on this runner
        run: |
          if [ -e /opt/ck-dev-build/deps ]; then
            echo "::error::/opt/ck-dev-build/deps exists, so the contract would not prove relocation"
            exit 1
          fi

      # T4: install through ck-core into a path with a space, then run there.
      - name: Install and run
        working-directory: crates/ck-net
        run: '"$CK_PHP_TEST_BIN" --ignored --nocapture'

      # T7: Linux runs PHP in a bare root (docker import, no registry).
      - name: Bare root
        run: /bin/bash build/php/build.sh bare-root "$CK_PHP_ARCHIVE"

  payload:
    name: Unsigned catalog payload
    needs: [plan, tool, contract]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ck-release-linux
          path: ${{ runner.temp }}/ck-release

      - name: Set up ck-release
        run: |
          chmod 755 "$RUNNER_TEMP/ck-release/ck-release"
          echo "CK_RELEASE_BIN=$RUNNER_TEMP/ck-release/ck-release" >>"$GITHUB_ENV"
          "$RUNNER_TEMP/ck-release/ck-release" lock check

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: descriptor-*
          merge-multiple: true
          path: ${{ runner.temp }}/descriptors

      - name: Build the payload
        run: |
          expires=$(date -u -d '+90 days' +%Y-%m-%dT%H:%M:%SZ)
          "$CK_RELEASE_BIN" payload build \
            --descriptors "$RUNNER_TEMP/descriptors" \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/php-candidate" \
            --sequence 1 \
            --expires "$expires" \
            --out "$RUNNER_TEMP/catalog-payload.candidate.json"
          cat "$RUNNER_TEMP/catalog-payload.candidate.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-payload-candidate
          path: ${{ runner.temp }}/catalog-payload.candidate.json
          if-no-files-found: error
          retention-days: 7
